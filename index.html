<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área do Cliente — Hodari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --roxo: #6B00F5;
      --roxo-suave: #8B30FF;
      --preto: #080808;
      --grafite: #111111;
      --cinza-borda: #2A2A2A;
      --cinza-texto: #888888;
      --branco: #FFFFFF;
      --fonte-titulo: 'Syne', sans-serif;
      --fonte-corpo: 'DM Sans', sans-serif;
      --transicao: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--fonte-corpo);
      background: var(--preto);
      color: var(--branco);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(107, 0, 245, 0.1) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .inner {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 480px;
    }

    .logo {
      font-family: var(--fonte-titulo);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--roxo);
      letter-spacing: -0.02em;
      margin-bottom: 64px;
      display: block;
      text-decoration: none;
    }

    .icone {
      width: 56px;
      height: 56px;
      border: 1px solid var(--cinza-borda);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      color: var(--roxo);
    }

    h1 {
      font-family: var(--fonte-titulo);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .subtexto {
      font-size: 0.95rem;
      color: var(--cinza-texto);
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn-wpp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--roxo);
      color: var(--branco);
      text-decoration: none;
      font-family: var(--fonte-titulo);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 100px;
      transition: all var(--transicao);
      margin-bottom: 20px;
    }

    .btn-wpp:hover {
      background: var(--roxo-suave);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(107, 0, 245, 0.4);
    }

    .divisor {
      width: 1px;
      height: 40px;
      background: var(--cinza-borda);
      margin: 8px auto 20px;
    }

    .nota {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.25);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-voltar {
      font-size: 0.85rem;
      color: var(--cinza-texto);
      text-decoration: none;
      transition: color var(--transicao);
    }

    .btn-voltar:hover {
      color: var(--branco);
    }
  </style>
</head>
<body>
  <div class="inner">
    <a href="/" class="logo">Hodari</a>

    <div class="icone">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1>Área do Cliente</h1>
    <p class="subtexto">
      Se você é cliente Hodari, acesse pelo link exclusivo<br />
      enviado diretamente pelo Luan.
    </p>

    <a href="https://wa.me/5541999999999?text=Oi%20Luan%2C%20sou%20cliente%20e%20preciso%20do%20meu%20link%20de%20acesso." class="btn-wpp" target="_blank" rel="noopener">
      Falar com o Luan →
    </a>

    <div class="divisor"></div>

    <p class="nota">
      Ainda não é cliente?<br />
      Preencha o formulário e receba uma proposta personalizada.
    </p>

    <a href="/" class="btn-voltar">← Voltar ao início</a>
  </div>
</body>
</html>
